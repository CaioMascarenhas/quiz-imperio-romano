services:
  postgres:
    image: postgres:16-alpine
    container_name: roma-postgres
    environment:
      POSTGRES_DB: roma_ludus
      POSTGRES_USER: roma
      POSTGRES_PASSWORD: roma
    ports:
      - "5432:5432"
    volumes:
      - roma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roma -d roma_ludus"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./backends/auth-service
    container_name: roma-auth-service
    environment:
      PORT: 4001
      DATABASE_URL: postgres://roma:roma@postgres:5432/roma_ludus
      JWT_SECRET: ${AUTH_SECRET:-roma-ludus-secret}
      CORS_ORIGIN: "*"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  quiz-service:
    build: ./backends/quiz-service
    container_name: roma-quiz-service
    env_file:
      - ./frontend/.env
    environment:
      PORT: 4002
      JWT_SECRET: ${AUTH_SECRET:-roma-ludus-secret}
      CORS_ORIGIN: "*"
    ports:
      - "4002:4002"

  progress-service:
    build: ./backends/progress-service
    container_name: roma-progress-service
    environment:
      PORT: 4003
      DATABASE_URL: postgres://roma:roma@postgres:5432/roma_ludus
      JWT_SECRET: ${AUTH_SECRET:-roma-ludus-secret}
      CORS_ORIGIN: "*"
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: roma-frontend
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:4001
      NEXT_PUBLIC_QUIZ_API_URL: http://localhost:4002
      NEXT_PUBLIC_PROGRESS_API_URL: http://localhost:4003
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - quiz-service
      - progress-service

volumes:
  roma_postgres_data:
